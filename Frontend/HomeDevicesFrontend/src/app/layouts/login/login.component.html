<main class="w-full flex justify-center items-center h-screen relative">
    
    <div class="w-1/3 flex flex-col justify-center items-center bg-[#1c1c1c] h-1/2 rounded-lg gap-12">
        <h1 class="text-2xl font-bold text-white">Welcome to Domuviz</h1>
        <app-dynamic-form 
            [fields]="loginFields" 
            [submitHandler]="submitHandler"/>
        <app-default-button 
            text="Sign In"
            [onClick]="goToRegister"/>
    </div>
</main>
