<main class="w-full flex justify-center items-center h-screen relative">  
    <div class="w-1/3 flex flex-col justify-center items-center bg-[#1c1c1c] h-5/6 rounded-lg gap-12">
        <h1 class="text-2xl font-bold text-white">Sign Up to Domuviz</h1>
        <app-dynamic-form 
            [fields]="signUpFields" 
            [submitHandler]="submitHandler"/>
        <app-default-button 
            text="Log In"
            [onClick]="goToLogin"/>
    </div>
</main>

@if(showAlert){
    <app-alert [onCloseClick]="closeAlert" [alert]="alert"/>
}
