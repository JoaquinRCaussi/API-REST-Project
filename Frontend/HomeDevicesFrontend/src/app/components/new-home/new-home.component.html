<div class="flex flex-col gap-12 p-8">
    <h1 class="text-white text-4xl font-bold w-full text-center">Create a new home</h1>
    <div class="w-full h-full flex justify-center items-center flex-col gap-4">
        <app-dynamic-form [fields]="fields" [submitHandler]="submitHandler"/>
    </div>
</div>
@if(showAlert){
    <app-alert [onCloseClick]="cancelHandler" [alert]="alert"/>
}
